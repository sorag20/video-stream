# main への push（リリース PR のマージ）で、イメージをビルドして ECR に push し、EKS にデプロイする
# 事前準備（Parameter Store の値・deploy/eks/setup-github-actions.sh・シークレット AWS_ROLE_ARN）は README の「AWS デプロイ (EKS)」を参照
name: Deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "k8s/**"
      - ".dockerignore"
      - "deploy/eks/deploy.sh"
      - ".github/workflows/deploy.yml"
  # Parameter Store の値だけを変えたときなどに、Actions タブ（または gh workflow run deploy.yml --ref main）から実行する
  # IAM ロールは main からしか引き受けられないため、main 以外のブランチを選ぶと AWS の認証で失敗する
  workflow_dispatch:

# デプロイを並行して実行しない。実行中のものは止めず、後から来たものを待たせる
concurrency:
  group: deploy-eks
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # OIDC で AWS の IAM ロールを引き受けるため

env:
  AWS_REGION: ap-northeast-1
  CLUSTER_NAME: video-stream

jobs:
  build:
    name: Build ${{ matrix.name }}
    # ノードは Graviton (arm64) のため、arm64 のランナーでエミュレーションなしにビルドする
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: upload-service
            context: .
            dockerfile: services/upload/Dockerfile
          - name: transcoder-service
            context: .
            dockerfile: services/transcoder/Dockerfile
          - name: streaming-service
            context: .
            dockerfile: services/streaming/Dockerfile
          - name: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true  # ログにアカウント ID を出さない

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          # コミットの SHA をタグにする（同じタグの使い回しだとノードが新しいイメージを pull しないため）
          tags: ${{ steps.ecr.outputs.registry }}/video-stream/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy
        run: bash deploy/eks/deploy.sh
        env:
          TAG: ${{ github.sha }}

      - name: Wait for rollout
        run: |
          # ノードを 0 台にしている間は Pod が起動しないため確認しない（ノードを起動すると新しいイメージで起動する）
          if [ -z "$(kubectl get nodes -o name)" ]; then
            echo "::notice::ノードが 0 台のため、Pod の起動確認をスキップしました"
            exit 0
          fi
          for r in $(kubectl get deployment,statefulset -n video-stream -o name); do
            kubectl rollout status -n video-stream "$r" --timeout=10m
          done
