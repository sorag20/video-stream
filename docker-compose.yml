services:
  # ----------------------------------------------------------------
  # インフラ
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save ""  # 永続化無効（開発用）
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 公式の minio/minio はイメージ配布が終了したため、互換のコミュニティフォーク (Silo) を使用
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # アプリケーション
  # ----------------------------------------------------------------
  upload-service:
    build:
      context: .
      dockerfile: services/upload/Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videodb
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure

  transcoder-service:
    build:
      context: .
      dockerfile: services/transcoder/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videodb
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure

  streaming-service:
    build:
      context: .
      dockerfile: services/streaming/Dockerfile
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videodb
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure

  # ----------------------------------------------------------------
  # フロントエンド
  # ----------------------------------------------------------------
  # 開発用に Vite の dev サーバーで動かす（web/ の変更はホットリロードで即時反映）。
  # 本番 (Kubernetes) は同じ Dockerfile の最終ステージ (nginx) を使う。
  web:
    build:
      context: ./web
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # ホストの node_modules (macOS 用バイナリ) で上書きしないよう、イメージ内のものを使う
      - /app/node_modules
    environment:
      UPLOAD_SERVICE_URL: http://upload-service:8080
      STREAMING_SERVICE_URL: http://streaming-service:8082
    depends_on:
      - upload-service
      - streaming-service
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
