# EKS クラスタ定義（eksctl 用）
# 作成: eksctl create cluster -f deploy/eks/cluster.yaml
# 削除: eksctl delete cluster -f deploy/eks/cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: video-stream
  region: ap-northeast-1

# ap-northeast-1b は新しいアカウントでは使えないため、使う AZ を明示する
availabilityZones: ["ap-northeast-1a", "ap-northeast-1c", "ap-northeast-1d"]

vpc:
  nat:
    # NAT Gateway（約 $45/月 + 通過データ課金）を作らない。ノードはパブリックサブネットから直接外に出る
    gateway: Disable

managedNodeGroups:
  - name: ng-arm
    # Graviton (arm64)。t4g.medium は Pod 上限が 17 で、このアプリ一式（約 21 Pod）が収まらない
    instanceType: t4g.large
    desiredCapacity: 1
    minSize: 0  # 使わないときは 0 にスケールしてノード代を止める
    maxSize: 1
    volumeSize: 30  # デフォルトは 80GB
    # EBS ボリューム（PV）は AZ をまたげないため、ノードを 1 つの AZ に固定する
    availabilityZones: ["ap-northeast-1a"]
    privateNetworking: false
    iam:
      withAddonPolicies:
        ebs: true                        # EBS CSI Driver（PVC 用）
        awsLoadBalancerController: true  # AWS Load Balancer Controller（NLB 用）

addons:
  - name: aws-ebs-csi-driver
