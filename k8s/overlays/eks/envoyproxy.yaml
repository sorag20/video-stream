# Envoy の Service を AWS Load Balancer Controller 経由で NLB として公開する
# SUBNET_ID と ACM_CERT_ARN は deploy/eks/deploy.sh が Parameter Store の値に置き換えて apply する（ここには実際の値を書かない）
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nlb-proxy
  namespace: video-stream
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          # NLB を 1 つの AZ に限定してパブリック IPv4 の料金を抑える（ノードと同じ ap-northeast-1a のパブリックサブネット）
          service.beta.kubernetes.io/aws-load-balancer-subnets: SUBNET_ID
          # 443 番の TLS を ACM の証明書で終端し、Envoy には復号済みの HTTP を渡す
          service.beta.kubernetes.io/aws-load-balancer-ssl-cert: ACM_CERT_ARN
          service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
