# EKS の新しいクラスタにはデフォルトの StorageClass がないため、gp3 をデフォルトとして作る
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
# PVC を消しても EBS ボリュームを残す（kubectl delete -k で動画が消えないように）
reclaimPolicy: Retain
# Pod が配置された AZ にボリュームを作る
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
