# 本番環境では Sealed Secrets や External Secrets Operator を使用すること
# ここではローカル開発用にベタ書き（base64エンコード済み）
# echo -n "postgres"   | base64 -> cG9zdGdyZXM=
# echo -n "videodb"    | base64 -> dmlkZW9kYg==
# echo -n "minioadmin" | base64 -> bWluaW9hZG1pbg==
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: video-stream
type: Opaque
data:
  POSTGRES_PASSWORD: cG9zdGdyZXM=   # postgres
  MINIO_ACCESS_KEY: bWluaW9hZG1pbg== # minioadmin
  MINIO_SECRET_KEY: bWluaW9hZG1pbg== # minioadmin
